[package]
name = "animus-execution-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Launchapp.dev"]
homepage = "https://github.com/launchapp-dev/animus-cli"
repository = "https://github.com/launchapp-dev/animus-protocol"
description = "Generation-fenced execution identity, queue lease, and repository reservation contracts for Animus."

[dependencies]
chrono = { workspace = true }
schemars = { version = "1.0", features = ["chrono04"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "animus-execution-protocol-export-schema"
path = "src/bin/export_schema.rs"
